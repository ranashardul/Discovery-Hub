# Serves the built Angular bundle. This container knows nothing about the
# backend services; the gateway routes /api/* to them and everything else here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames (outputHashing: all) are immutable, so they can be
    # cached hard. index.html must not be, or a deploy leaves browsers loading
    # the old bundle and referencing chunks that no longer exist.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Angular routes are real paths (/cases/123), not fragments, so any
    # unmatched path has to fall back to index.html or a refresh 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
