# Discovery Hub API gateway.
#
# The single origin the browser talks to. Because the UI and every API share
# this origin, none of the Spring services need CORS configuration — they stay
# closed by default.
#
# The route table below MUST stay in step with discovery-hub-ui/proxy.conf.json,
# which provides the same paths for `ng serve`. If they diverge, a screen works
# in development and 404s in a container.

upstream ingestion   { server ingestion-service:8081; }
upstream search      { server search-service:8082; }
upstream casehold    { server case-hold-service:8083; }
upstream exportaudit { server export-audit-service:8084; }
upstream ui          { server discovery-hub-ui:80; }

server {
    listen 80;
    server_name _;

    # A message body carries attachments; the default 1m is too small to
    # ingest one.
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # An export package is assembled synchronously inside the verify call and
    # can take a while on a large case.
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;

    # ---------------------------------------------------------------- ingestion
    location /api/ingestion { proxy_pass http://ingestion; }

    # ------------------------------------------------------------------- search
    # Reindex walks the entire collection and is unauthenticated, so it is not
    # reachable through the public origin. It stays available on the service
    # port for an operator: curl -X POST localhost:8082/api/search/reindex
    location = /api/search/reindex {
        return 403 '{"status":403,"error":"Forbidden","message":"Reindex is not exposed through the gateway; call the search service directly."}';
        add_header Content-Type application/json always;
    }

    location /api/search { proxy_pass http://search; }

    # --------------------------------------------------------------- case, hold
    location /api/v1/cases { proxy_pass http://casehold; }
    location /api/v1/holds { proxy_pass http://casehold; }

    # ------------------------------------------------------------ export, audit
    # Served under /api, not /api/v1. Getting this wrong is why both screens
    # failed on first load before commit 97556b4.
    location /api/exports { proxy_pass http://exportaudit; }
    location /api/audit   { proxy_pass http://exportaudit; }

    # ------------------------------------------------------------------- health
    # One path per service, matching the pathRewrite rules in proxy.conf.json
    # so the dashboard's service list works identically in both topologies.
    location /actuator/health/ingestion    { proxy_pass http://ingestion/actuator/health; }
    location /actuator/health/search       { proxy_pass http://search/actuator/health; }
    location /actuator/health/case-hold    { proxy_pass http://casehold/actuator/health; }
    location /actuator/health/export-audit { proxy_pass http://exportaudit/actuator/health; }

    # The gateway's own liveness, for the compose health check.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    # ----------------------------------------------------------------------- UI
    location / { proxy_pass http://ui; }
}
