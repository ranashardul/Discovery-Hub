services:
  mongodb:
    image: mongo:7
    container_name: stown-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: legal_discovery
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka:
    image: apache/kafka:3.7.2
    container_name: stown-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # INTERNAL is used by containers on this network (kafka:19092).
      # EXTERNAL is used from the host machine (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: stown-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: stown-kafka-ui
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.3
    container_name: stown-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx1g}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  ingestion-service:
    build:
      context: ../ingestion-service
      dockerfile: Dockerfile
    image: stown/ingestion-service:latest
    container_name: stown-ingestion-service
    ports:
      # Host port is configurable; the container port stays 8081 so the
      # health check and Dockerfile stay fixed.
      - "${INGESTION_PORT:-8081}:8081"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/legal_discovery}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_LISTENER_CONCURRENCY: ${KAFKA_LISTENER_CONCURRENCY:-3}
      S3_BUCKET: ${S3_BUCKET:-discovery-hub-attachments}
      # Single dash: substitute the default only when the variable is unset.
      # An explicitly empty value means "use real AWS S3", and ":-" would
      # wrongly override it with the MinIO endpoint.
      S3_ENDPOINT: ${S3_ENDPOINT-http://minio:9000}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}
      # Empty means "build the standard https bucket URL", so single dash again.
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL-http://localhost:9000}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      # Temporary credentials (SSO, assumed role, MFA) also need a session
      # token. Uncomment this line in that case. It stays commented by default
      # because an empty token would be sent as an empty security-token header
      # and rejected, breaking the long-term access-key path.
      # AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN-}
      OUTBOX_INTERVAL_MS: ${OUTBOX_INTERVAL_MS:-15000}
      # Retention and disposition (FR-5). Disposition deletes data, so it is
      # off unless switched on. Periods are Spring Durations: 2555d, 1m, 30s.
      DISPOSITION_ENABLED: ${DISPOSITION_ENABLED:-false}
      DISPOSITION_DRY_RUN: ${DISPOSITION_DRY_RUN:-false}
      RETENTION_EMAIL: ${RETENTION_EMAIL:-2555d}
      RETENTION_CHAT: ${RETENTION_CHAT:-1095d}
      RETENTION_DEFAULT: ${RETENTION_DEFAULT:-2555d}
      RETENTION_MIN_PERIOD: ${RETENTION_MIN_PERIOD:-24h}
      ALLOW_SHORT_RETENTION: ${ALLOW_SHORT_RETENTION:-false}
      DISPOSITION_INTERVAL_MS: ${DISPOSITION_INTERVAL_MS:-60000}
      DISPOSITION_BATCH_SIZE: ${DISPOSITION_BATCH_SIZE:-200}
      DISPOSITION_MAX_DELETES: ${DISPOSITION_MAX_DELETES:-500}
      PURGE_SWEEP_INTERVAL_MS: ${PURGE_SWEEP_INTERVAL_MS:-60000}
      # Legal holds are consumed from the case-hold service's topic.
      CASE_HOLD_TOPIC: ${CASE_HOLD_TOPIC:-case-hold.events}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  search-service:
    build:
      context: ../search-service
      dockerfile: Dockerfile
    image: stown/search-service:latest
    container_name: stown-search-service
    ports:
      - "${SEARCH_PORT:-8082}:8082"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/legal_discovery}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS:-http://elasticsearch:9200}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      SEARCH_INDEX: ${SEARCH_INDEX:-messages}
      SEARCH_RECONCILE_INTERVAL_MS: ${SEARCH_RECONCILE_INTERVAL_MS:-60000}
      SEARCH_ORPHAN_SWEEP_ENABLED: ${SEARCH_ORPHAN_SWEEP_ENABLED:-true}
      SEARCH_ORPHAN_SWEEP_BATCH_SIZE: ${SEARCH_ORPHAN_SWEEP_BATCH_SIZE:-500}
      SEARCH_DISPOSED_TOPIC: ${SEARCH_DISPOSED_TOPIC:-message.disposed}
      SEARCH_DISPOSED_DEAD_LETTER_TOPIC: ${SEARCH_DISPOSED_DEAD_LETTER_TOPIC:-message.disposed.dlt}
      SEARCH_FAILURE_MAX_ATTEMPTS: ${SEARCH_FAILURE_MAX_ATTEMPTS:-10}
      SEARCH_REINDEX_BATCH_SIZE: ${SEARCH_REINDEX_BATCH_SIZE:-500}
      SEARCH_MAX_RESOLVED_IDS: ${SEARCH_MAX_RESOLVED_IDS:-10000}
      SEARCH_RESOLVE_IDS_PAGE_SIZE: ${SEARCH_RESOLVE_IDS_PAGE_SIZE:-1000}
      SEARCH_MAX_CUSTODIANS: ${SEARCH_MAX_CUSTODIANS:-500}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: stown-postgres
    ports:
      # Host port 5433 to avoid clashing with any locally-installed PostgreSQL
      # or standalone containers already bound to 5432. Services inside the
      # compose network connect via postgres:5432, so only the host mapping
      # changes.
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-case_hold}
      POSTGRES_USER: ${POSTGRES_USER:-casehold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casehold}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casehold} -d ${POSTGRES_DB:-case_hold}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  case-hold-service:
    build:
      context: ../case-hold-service
      dockerfile: Dockerfile
    image: stown/case-hold-service:latest
    container_name: stown-case-hold-service
    ports:
      - "${CASE_HOLD_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_URI: ${POSTGRES_URI:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-case_hold}}
      POSTGRES_USER: ${POSTGRES_USER:-casehold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casehold}
      # Read-only: resolves communication references to real message metadata
      # from the collection owned by ingestion-service. Point this at an Atlas
      # mongodb+srv:// URI to read from a cluster.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/legal_discovery}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      CASE_HOLD_TOPIC: ${CASE_HOLD_TOPIC:-case-hold.events}
      # Read-only, and only for the hold scope preview. Not a depends_on:
      # cases and holds must stay usable when search is down, so the preview
      # degrades to a 503 on that one endpoint instead of blocking startup.
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-http://search-service:8082}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  export-audit-service:
    build:
      context: ../export-audit-service
      dockerfile: Dockerfile
    image: stown/export-audit-service:latest
    container_name: stown-export-audit-service
    ports:
      - "${EXPORT_PORT:-8084}:8084"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      case-hold-service:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
    environment:
      EXPORT_PORT: "8084"
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/legal_discovery}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-3}
      KAFKA_LISTENER_CONCURRENCY: ${KAFKA_LISTENER_CONCURRENCY:-2}
      CASE_HOLD_BASE_URL: ${CASE_HOLD_BASE_URL:-http://case-hold-service:8083}
      CASE_HOLD_EVENTS_TOPIC: ${CASE_HOLD_TOPIC:-case-hold.events}
      INGESTION_BASE_URL: ${INGESTION_BASE_URL:-http://ingestion-service:8081}
      INGESTION_CONNECT_TIMEOUT_MS: ${INGESTION_CONNECT_TIMEOUT_MS:-2000}
      INGESTION_READ_TIMEOUT_MS: ${INGESTION_READ_TIMEOUT_MS:-5000}
      S3_SOURCE_BUCKET: ${S3_SOURCE_BUCKET:-discovery-hub-attachments}
      S3_EXPORT_BUCKET: ${S3_EXPORT_BUCKET:-discovery-hub-exports}
      # Single dash: an explicitly empty value means "use real AWS S3", and
      # ":-" would wrongly override it with the MinIO endpoint (see ingestion).
      S3_ENDPOINT: ${S3_ENDPOINT-http://minio:9000}
      S3_PATH_STYLE_ACCESS: ${S3_PATH_STYLE_ACCESS:-true}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-minioadmin}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      EXPORT_DOWNLOAD_EXPIRY_SECONDS: ${EXPORT_DOWNLOAD_EXPIRY_SECONDS:-900}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  discovery-hub-ui:
    build:
      context: ../discovery-hub-ui
      dockerfile: Dockerfile
    image: stown/discovery-hub-ui:latest
    container_name: stown-discovery-hub-ui
    # Deliberately not published on the host: the browser reaches the UI
    # through the gateway, so there is one origin and no CORS to configure.
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    container_name: stown-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      discovery-hub-ui:
        condition: service_healthy
      ingestion-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      case-hold-service:
        condition: service_healthy
      export-audit-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
  minio_data:
  elasticsearch_data:
  kafka_data:
  postgres_data:
