server:
  port: ${INGESTION_PORT:8081}

spring:
  application:
    name: ingestion-service

  # Spring Boot 4 reads the connection URI from spring.mongodb.*; only Spring
  # Data specific settings live under spring.data.mongodb.*.
  # Set MONGODB_URI to an Atlas mongodb+srv:// string to use a cluster.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/legal_discovery}

  data:
    mongodb:
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ingestion-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.stown.ingestion"
        spring.json.value.default.type: com.stown.ingestion.messaging.IngestionRequestedEvent

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 10000

    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  storage:
    bucket: ${S3_BUCKET:discovery-hub-attachments}
    region: ${AWS_REGION:ap-south-1}
    # Empty endpoint means real AWS S3; set it to a MinIO URL for local runs.
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    path-style-access: ${S3_PATH_STYLE_ACCESS:true}
    create-bucket-on-startup: ${S3_CREATE_BUCKET:true}
    staging-prefix: staging
    message-prefix: messages
    public-base-url: ${S3_PUBLIC_BASE_URL:}

  # Retention and disposition (PRD FR-5). Periods bind as Spring Durations, so
  # "2555d" and "1m" are both valid; a demo needs no code change.
  retention:
    # Disposition deletes data, so it is opt-in per environment.
    enabled: ${DISPOSITION_ENABLED:false}
    # Report what would be deleted without deleting it.
    dry-run: ${DISPOSITION_DRY_RUN:false}

    periods:
      EMAIL: ${RETENTION_EMAIL:2555d}   # 7 years
      CHAT: ${RETENTION_CHAT:1095d}     # 3 years
    default-period: ${RETENTION_DEFAULT:2555d}

    # Refuses to start with a shorter period unless explicitly allowed, so a
    # demo value cannot reach an environment holding real data.
    min-period: ${RETENTION_MIN_PERIOD:24h}
    allow-short-retention: ${ALLOW_SHORT_RETENTION:false}

    # A single message may carry its own retention, which is how disposition
    # is demonstrated without shortening a whole type's period and expiring
    # the corpus with it. Bounded, because this is for a demo rather than for
    # expressing a retention schedule.
    message-override-enabled: ${RETENTION_MESSAGE_OVERRIDE_ENABLED:true}
    message-override-max: ${RETENTION_MESSAGE_OVERRIDE_MAX:5m}

    batch-size: ${DISPOSITION_BATCH_SIZE:200}
    max-deletes-per-run: ${DISPOSITION_MAX_DELETES:500}
    disposition-interval-ms: ${DISPOSITION_INTERVAL_MS:60000}
    purge-sweep-interval-ms: ${PURGE_SWEEP_INTERVAL_MS:60000}

  # Legal holds are owned by the case-hold service; this service only consumes
  # them. Its producer writes raw JSON with a StringSerializer, so the listener
  # uses a dedicated container factory (see KafkaConfig).
  case-hold:
    topic: ${CASE_HOLD_TOPIC:case-hold.events}
    consumer-group: ${CASE_HOLD_CONSUMER_GROUP:ingestion-service-holds}

  kafka:
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    retry:
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 30000
      max-elapsed-ms: 120000

  outbox:
    initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS:15000}
    interval-ms: ${OUTBOX_INTERVAL_MS:15000}

logging:
  level:
    com.stown.ingestion: ${LOG_LEVEL:INFO}
