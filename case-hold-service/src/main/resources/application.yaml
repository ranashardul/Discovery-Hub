server:
  port: ${CASE_HOLD_PORT:8083}

spring:
  application:
    name: case-hold-service

  # Read-only access to the `messages` collection owned by ingestion-service.
  # Used to resolve communication references to real message metadata; this
  # service never writes to MongoDB. Spring Boot 4 reads the connection URI
  # from spring.mongodb.*; only Spring Data settings live under
  # spring.data.mongodb.*. Set MONGODB_URI to an Atlas mongodb+srv:// string
  # to read from a cluster.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/legal_discovery}

  data:
    mongodb:
      # This service owns no MongoDB collection, so it must never create or
      # alter indexes on someone else's.
      auto-index-creation: false

  datasource:
    url: ${POSTGRES_URI:jdbc:postgresql://localhost:5432/case_hold}
    username: ${POSTGRES_USER:casehold}
    password: ${POSTGRES_PASSWORD:casehold}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must never create or alter it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      # The outbox stores pre-serialised JSON, so values travel as raw strings.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        max.block.ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  # Read-only, and only for the hold scope preview: counting what a rule
  # would cover is delegated to the search index rather than reimplemented
  # here, so the preview cannot disagree with the hold that follows it.
  search:
    base-url: ${SEARCH_BASE_URL:http://localhost:8082}
    connect-timeout-ms: ${SEARCH_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${SEARCH_READ_TIMEOUT_MS:5000}

  case-hold:
    topic: ${CASE_HOLD_TOPIC:case-hold.events}
    max-page-size: ${CASE_HOLD_MAX_PAGE_SIZE:100}
    outbox:
      initial-delay-ms: ${CASE_HOLD_OUTBOX_INITIAL_DELAY_MS:15000}
      interval-ms: ${CASE_HOLD_OUTBOX_INTERVAL_MS:5000}
      batch-size: ${CASE_HOLD_OUTBOX_BATCH_SIZE:100}

logging:
  level:
    com.stown.casehold: ${LOG_LEVEL:INFO}
